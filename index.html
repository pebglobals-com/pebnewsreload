<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/peb-news-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001018" />
    <meta
      name="description"
      content="PEB News — Latest news, real stories and impactful reporting from the Niger Delta, Nigeria, Africa and the world."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800&display=swap"
      rel="stylesheet"
    />
    <title>PEB News — Latest news. Real stories. Impactful reporting.</title>
    <script>
      (function () {
        try {
          var requested = new URLSearchParams(location.search).get('theme')
          var saved = localStorage.getItem('peb-theme')
          var dark = requested
            ? requested !== 'light'
            : saved
              ? saved === 'dark'
              : true
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      html { background: #001018; }
      html:not(.dark) { background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
