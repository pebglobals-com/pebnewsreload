      rel="stylesheet"
    />
    <title>PEB News — Latest news. Real stories. Impactful reporting.</title>
    <script>
      (function () {
        try {
          var requested = new URLSearchParams(location.search).get('theme')
          var saved = localStorage.getItem('peb-theme')
          var dark = requested
            ? requested !== 'light'
            : saved
              ? saved === 'dark'
              : true
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      html { background: #001018; }
      html:not(.dark) { background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
