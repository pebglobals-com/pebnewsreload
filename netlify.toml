[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/v1/*"
  to = "https://pebnews.pebnews.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sanctum/*"
  to = "https://pebnews.pebnews.com/sanctum/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
